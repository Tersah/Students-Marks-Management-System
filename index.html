<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="description" content="Track student marks, grades and class stats. Simple, fast, private.">
  <title>Marks — Student Marks Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <header>
      <span class="pill">● Student Marks Manager</span>
      <h1>Scores, <em>sorted.</em></h1>
      <p>Add marks. Get grades. See the class at a glance.</p>
    </header>

    <section class="stats" aria-label="Class summary">
      <div><b id="countStat">0</b><span>Students</span></div>
      <div><b id="averageStat">—</b><span>Average</span></div>
      <div><b id="highestStat">—</b><span>Top mark</span></div>
      <div><b id="passStat">—</b><span>Pass rate</span></div>
    </section>

    <form id="addForm" class="card add">
      <input id="nameInput" maxlength="70" placeholder="Student name" aria-label="Student name" autocomplete="off" required>
      <input id="markInput" type="number" min="0" max="100" step="1" placeholder="Mark" aria-label="Mark from 0 to 100" required>
      <input id="classInput" maxlength="40" placeholder="Class (optional)" aria-label="Class or course">
      <button class="btn primary" type="submit">Add</button>
    </form>
    <div class="notice" id="notice" role="status" aria-live="polite"></div>

    <section class="card">
      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="Search…" aria-label="Search name or class">
        <select id="sortSelect" aria-label="Sort students">
          <option value="name">A–Z</option>
          <option value="mark-desc">Highest</option>
          <option value="mark-asc">Lowest</option>
        </select>
        <button id="exportButton" class="btn ghost" type="button">Export CSV</button>
      </div>
      <ul id="studentRows"></ul>
      <p id="emptyState" class="empty">No students found.</p>
      <p class="count" id="resultCount"></p>
    </section>
  </main>

  <footer>A 80+ · B 70+ · C 60+ · D 50+ · F below · Saved in your browser only</footer>

  <div class="backdrop" id="editBackdrop" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <form class="modal" id="editForm">
      <h2 id="editTitle">Edit student</h2>
      <input id="editId" type="hidden">
      <input id="editName" maxlength="70" placeholder="Name" aria-label="Student name" required>
      <input id="editMark" type="number" min="0" max="100" step="1" placeholder="Mark" aria-label="Mark" required>
      <input id="editClass" maxlength="40" placeholder="Class" aria-label="Class or course">
      <div class="modal-actions">
        <button class="btn ghost" id="cancelEdit" type="button">Cancel</button>
        <button class="btn primary" type="submit">Save</button>
      </div>
    </form>
  </div>
</body>
</html>
